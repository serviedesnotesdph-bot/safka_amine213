{% extends "base.html" %}
{% block content %}
<h1>🔐 Reinitialiser le mot de passe</h1>
<p style="margin-bottom:1rem;color:#666">
  <strong>Question :</strong> {{ security_questions.get(user.security_question, user.security_question) }}
</p>
<form method="post">
  {{ csrf_input() }}
  <label>Votre reponse
    <input type="text" name="security_answer" required autocomplete="off">
  </label>
  <label>Nouveau mot de passe (8 caracteres min.)
    <input type="password" name="password" minlength="8" required>
  </label>
  <label>Confirmer le nouveau mot de passe
    <input type="password" name="confirm" minlength="8" required>
  </label>
  <button class="btn" type="submit">Modifier le mot de passe</button>
</form>
{% endblock %}
